<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>if(location.hostname.endsWith('vercel.app')&&!location.pathname.endsWith('/'))location.replace(location.pathname+'/'+location.search+location.hash)</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quiz · Michele Salla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Identidade do Desafio 7 em 7: Sora + Raleway, roxo→violeta, amarelo nos botões, fundo rosado. */
:root{--roxo:#9E047C;--violeta:#8D29F2;--grad:linear-gradient(170deg,#9E047C 0%,#8D29F2 100%);--rosa:#FFF3FD;--rosa-2:#F7E4F3;--amarelo:#FFFC00;
  --preto:#231A27;--texto:#4A3F52;--linha:#EAD6E6;--branco:#FFFFFF;--verde:#1C873C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--rosa);color:var(--preto);font:400 16px/1.5 Raleway,system-ui,sans-serif}
img{max-width:100%;height:auto;display:block}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;margin:0;line-height:1.18;text-wrap:balance}
p{margin:0}
.app{max-width:440px;margin:0 auto;min-height:100dvh;padding:14px 18px 32px;display:flex;flex-direction:column;gap:16px}
.topo{display:flex;align-items:center;gap:10px;min-height:28px}
.voltar{border:0;background:none;font:700 22px/1 Sora,sans-serif;color:var(--roxo);cursor:pointer;padding:4px 6px}
.barra{flex:1;height:8px;border-radius:99px;background:var(--rosa-2);overflow:hidden}
.barra i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .3s}
.logo{width:120px;margin:0 auto}
.etiqueta{align-self:center;background:var(--grad);color:#fff;font:700 12px/1 Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border-radius:99px}
.capa h1{font-size:29px;font-weight:800;text-align:center}
.capa h1 mark,.oferta h2 mark{background:none;color:var(--roxo)}
.capa .sub{text-align:center;color:var(--texto);font-size:17px}
.foto-capa{position:relative;max-width:220px;margin:0 auto}
.foto-capa::before{content:"";position:absolute;inset:16% 4% 0;border-radius:200px 200px 28px 28px;background:var(--grad)}
.foto-capa img{position:relative}
.pend{background:#FFF7B8;border:1.5px dashed #B59B00;border-radius:6px;padding:0 4px;color:#6B5A00;font-weight:700}
.botao{display:block;width:100%;border:0;cursor:pointer;background:var(--amarelo);color:#111;font:800 17px/1.25 Sora,sans-serif;padding:17px 18px;border-radius:99px;text-align:center;text-decoration:none;box-shadow:0 10px 24px rgba(158,4,124,.18)}
.botao:focus-visible,.op:focus-visible{outline:3px solid var(--violeta);outline-offset:2px}
.miudo{text-align:center;font-size:13px;color:var(--texto)}
.pergunta h2{font-size:23px;font-weight:800}
.pergunta .sub{color:var(--texto);margin-top:6px}
.ops{display:grid;gap:10px}
.ops.c2{grid-template-columns:1fr 1fr}
.op{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--branco);border:2px solid var(--linha);border-radius:16px;padding:14px 16px;cursor:pointer;font:600 16px/1.3 Raleway,sans-serif;color:var(--preto)}
.op small{font-weight:500;color:var(--texto);font-size:14px}
.op.on{border-color:var(--roxo);background:#FBEAF6}
.ops.c2 .op{align-items:center;text-align:center;justify-content:center;min-height:62px}
.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:20px;padding:18px;display:grid;gap:10px}
.michele img{border-radius:20px;background:var(--grad);height:300px;width:auto;object-fit:contain;margin:0 auto}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grade img{border-radius:12px;aspect-ratio:1/1;object-fit:cover}
.aviso{font-size:12px;color:var(--texto);text-align:center}
.ciclo{display:grid;gap:8px}
.ciclo p{background:var(--branco);border-left:4px solid var(--roxo);border-radius:10px;padding:10px 12px;font-weight:600}
.carregando{text-align:center;align-items:center;justify-content:center;flex:1}
.roda{width:72px;height:72px;border-radius:50%;border:7px solid var(--rosa-2);border-top-color:var(--roxo);margin:24px auto;animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.linhas{display:grid;gap:8px;text-align:left}
.linhas p{background:var(--branco);border-radius:10px;padding:10px 12px}
.linhas p::before{content:"✓ ";color:var(--verde);font-weight:800}
.perfil{background:var(--grad);color:#fff;border-radius:22px;padding:22px 18px;display:grid;gap:10px}
.perfil .rot{font:700 12px/1 Sora,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--amarelo)}
.perfil h2{font-size:27px;color:#fff}
.bloco{display:grid;gap:6px}
.bloco h3{font-size:17px;color:var(--roxo)}
.oferta h2{font-size:25px;font-weight:800}
.modulos{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.modulos li{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:12px 14px}
.modulos b{display:block;font-family:Sora,sans-serif;font-size:15px}
.modulos span{font-size:14px;color:var(--texto)}
.preco{background:var(--grad);color:#fff;border-radius:24px;padding:22px;text-align:center;display:grid;gap:8px}
.preco .v{font:800 56px/1 Sora,sans-serif;color:var(--amarelo)}
.preco .v small{font-size:.42em;vertical-align:.9em;margin-right:3px}
.medo{background:#FBEAF6;border-radius:16px;padding:14px 16px;font-size:15px}
.selos{display:flex;align-items:center;justify-content:center;gap:12px;font-size:13px}
.selos img{width:58px}
@media (prefers-reduced-motion: reduce){.roda{animation:none}.barra i{transition:none}}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>
<script src="quiz.js"></script>
<script>
const q = new URLSearchParams(location.search)
const P = PROMESSAS[q.get('p')] ? Number(q.get('p')) : 1
const resp = {}
let i = 0
const app = document.getElementById('app')
const pend = s => s.replace(/\[\[(.+?)\]\]/g, '<span class="pend">$1</span>')
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

// Painel: abre uma tela direto e preenche respostas de exemplo para o perfil pedido.
const EXEMPLO = {
  'nova-fase': { fase: 'pos-parto', sinais: ['escapes'], medo: 'dor', 'tempo-dia': '10-15' },
  'estufada': { 'barriga-dia': 'estufa-noite', sinais: ['estufada'], fase: 'nenhuma', medo: 'tempo', 'tempo-dia': '5' },
  'esforcada': { 'barriga-dia': 'sempre', abdominal: 'muito', fase: 'nenhuma', sinais: ['costas'], medo: 'fracasso', 'tempo-dia': '15-30' },
  'recomeco': { 'barriga-dia': 'sempre', abdominal: 'parei', recomecos: 'perdi-conta', sabotador: 'ansiedade', fase: 'nenhuma', sinais: ['ansiedade'], medo: 'rebote', 'tempo-dia': '10-15' },
  'depois': { 'barriga-dia': 'sempre', abdominal: 'nunca', recomecos: '1-2', sabotador: 'tempo', fase: 'maes', sinais: ['cansaco'], medo: 'dinheiro', 'tempo-dia': '5' },
}
if (q.get('perfil') && EXEMPLO[q.get('perfil')]) Object.assign(resp, EXEMPLO[q.get('perfil')])
if (q.get('tela')) { const k = TELAS.findIndex(t => t.id === q.get('tela')); if (k >= 0) i = k }

// Rastreio do painel da Michele (painel.michelesalla.com.br, aba Quiz Diva): cada tela conta como um bloco
// (window.plBloco = número da tela) e cada capa é uma página (quiz-p1 … quiz-p5). Não roda nas telas abertas pelo painel de revisão.
if (!q.get('tela')) {
  const r = document.createElement('script')
  r.async = true
  r.src = 'https://painel.michelesalla.com.br/rastreio.js'
  r.dataset.slug = 'quiz-p' + P
  r.dataset.checkout = 'sim'
  document.body.appendChild(r)
}

const contaveis = TELAS.filter(t => !['capa', 'oferta'].includes(t.tipo)).length
function progresso() { const n = TELAS.slice(0, i + 1).filter(t => !['capa', 'oferta'].includes(t.tipo)).length; return Math.round(100 * n / contaveis) }
function topo() { return i === 0 ? '' : `<div class="topo"><button class="voltar" aria-label="Voltar" onclick="volta()">‹</button><div class="barra" aria-hidden="true"><i style="width:${progresso()}%"></i></div></div>` }
function vai() { i = Math.min(i + 1, TELAS.length - 1); desenha(); scrollTo(0, 0) }
function volta() { i = Math.max(i - 1, 0); desenha(); scrollTo(0, 0) }

function desenha() {
  const t = TELAS[i]
  if (window.plTique) window.plTique() // fecha o tempo da tela anterior
  window.plBloco = i + 1
  if (window.plTique) window.plTique() // marca a chegada nesta tela
  let h = topo()
  if (t.tipo === 'capa') {
    const p = PROMESSAS[P]
    h += `<section class="capa" style="display:grid;gap:16px">
      <img class="logo" src="${IMG}logo-desafio-7em7-escura.png" alt="Desafio 7 em 7">
      <span class="etiqueta">${esc(p.etiqueta)}</span>
      <h1>${pend(p.titulo)}</h1>
      <p class="sub">${esc(p.sub)}</p>
      <button class="botao" onclick="vai()">${esc(p.botao)} →</button>
      <div class="foto-capa"><img src="${IMG}michele-recorte.webp" alt="Michele Salla" width="802" height="1292"></div>
      <p class="miudo">Por Michele Salla, educadora física</p></section>`
  } else if (t.tipo === 'uma' || t.tipo === 'varias') {
    const marc = t.tipo === 'varias' ? (resp[t.id] || []) : [resp[t.id]]
    h += `<section class="pergunta"><h2>${esc(t.titulo)}</h2><p class="sub">${esc(t.sub || '')}</p></section>
      <div class="ops ${t.cols === 2 ? 'c2' : ''}">${t.op.map(o => `<button class="op ${marc.includes(o[0]) ? 'on' : ''}" onclick="escolhe('${t.id}','${o[0]}')">${esc(o[1])}${o[2] ? ` <small>${esc(o[2])}</small>` : ''}</button>`).join('')}</div>
      ${t.tipo === 'varias' ? `<button class="botao" onclick="vai()" ${marc.length ? '' : 'disabled style="opacity:.45"'}>Continuar →</button>` : ''}`
  } else if (t.tipo === 'michele') {
    h += `<section class="michele cartao"><img src="${IMG}michele-recorte.webp" alt="Michele Salla" width="802" height="1292">
      <h2 style="font-size:22px">Prazer, eu sou a Michele Salla</h2>
      <p>Educadora Física desde 2005, especialista em emagrecimento comportamental, licenciada na técnica da Barriga Negativa e autora do livro Vida Diva (2025).</p>
      <p>Referência em transformação feminina há mais de 20 anos, criei uma metodologia que já ajudou milhares de mulheres a perderem a barriga sem viver de dietas: primeiro a mente, depois o corpo.</p>
      <p>Nas próximas perguntas, vou entender a sua barriga e a sua rotina para te mostrar por onde começar.</p></section>
      <button class="botao" onclick="vai()">Continuar →</button>`
  } else if (t.tipo === 'prova') {
    h += `<section class="pergunta"><h2>Alunas que já começaram pelo Desafio 7 em 7</h2></section>
      <div class="grade">${[1, 2, 3, 4].map(n => `<img src="${IMG}resultado-${n}.webp" alt="Antes e depois de aluna do Desafio 7 em 7" width="800" height="800">`).join('')}</div>
      <p class="aviso">Os resultados variam de pessoa para pessoa.</p>
      <button class="botao" onclick="vai()">Continuar →</button>`
  } else if (t.tipo === 'insight') {
    h += `<section class="pergunta"><h2>Talvez você se reconheça nisso</h2></section>
      <div class="ciclo"><p>Rotina corrida. Cansaço.</p><p>Filhos, casa, trabalho…</p><p>Todo mundo virou prioridade, menos você.</p><p>E quando você percebe, a barriga aumentou e a autoestima sumiu.</p></div>
      <div class="cartao"><p><b>Isso não é “normal”, e não é falta de esforço.</b> Com a técnica certa, poucos minutos por dia já são um começo: respiração, postura e o seu cinturão natural trabalhando a seu favor.</p></div>
      <button class="botao" onclick="vai()">Faz sentido, continuar →</button>`
  } else if (t.tipo === 'carregando') {
    h += `<section class="carregando" style="display:flex;flex-direction:column;gap:10px"><div class="roda" aria-hidden="true"></div><h2 style="font-size:22px">${esc(t.titulo)}</h2>
      <div class="linhas">${t.linhas.map(l => `<p>${esc(l)}</p>`).join('')}</div></section>
      <button class="botao" onclick="vai()">Ver o próximo passo →</button>`
  } else if (t.tipo === 'resultado') {
    const k = q.get('perfil') && PERFIS[q.get('perfil')] ? q.get('perfil') : perfilDe(resp), pf = PERFIS[k]
    h += `<section class="perfil"><span class="rot">O seu perfil</span><h2>${esc(pf.nome)}</h2><p>${esc(pf.retrato)}</p></section>
      <div class="bloco cartao"><h3>O que está te travando</h3><p>${esc(pf.trava)}</p></div>
      <div class="bloco cartao"><h3>Por onde você começa</h3><p>${esc(pf.comeca)}</p></div>
      <button class="botao" onclick="vai()">Ver o meu plano de 7 dias →</button>`
  } else if (t.tipo === 'oferta') {
    const k = q.get('perfil') && PERFIS[q.get('perfil')] ? q.get('perfil') : perfilDe(resp), pf = PERFIS[k]
    const m = MEDO[resp.medo]
    // Igual ao rastreio.js do painel: leva o rastreio do anúncio e marca a página (sck) com a promessa da capa.
    const u = new URL(CHECKOUT)
    ;['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'fbclid'].forEach(c => q.get(c) && u.searchParams.set(c, q.get(c)))
    if (q.get('utm_term')) u.searchParams.set('src', q.get('utm_term'))
    u.searchParams.set('sck', 'quiz-p' + P)
    const link = u.toString()
    h += `<section class="oferta" style="display:grid;gap:14px">
      <span class="etiqueta">Plano para ${esc(pf.nome)}</span>
      <h2>O seu caminho começa no <mark>Desafio 7 em 7</mark></h2>
      <p>7 dias de aulas práticas de 15 minutos, em casa, com exercícios funcionais, respiração e hipopressivos para trabalhar a barriga e a cintura.</p>
      <ul class="modulos">${MODULOS.map(x => `<li><b>${esc(x[0])}</b><span>${esc(x[1])}</span></li>`).join('')}
        <li><b>Bônus</b><span>${BONUS.map(esc).join(' · ')}</span></li></ul>
      <div class="grade">${[1, 2, 5, 6].map(n => `<img src="${IMG}resultado-${n}.webp" alt="Antes e depois de aluna do Desafio 7 em 7" width="800" height="800" loading="lazy">`).join('')}</div>
      <p class="aviso">Os resultados variam de pessoa para pessoa.</p>
      ${m ? `<div class="medo"><b>Você disse que tem medo de “${esc(TELAS.find(x => x.id === 'medo').op.find(o => o[0] === resp.medo)[1].toLowerCase())}”.</b> Por isso: ${esc(m)}</div>` : ''}
      <div class="preco"><span>Tudo isso por apenas</span><span class="v"><small>R$</small>47</span><span>à vista · ou 12x de R$ 4,83</span>
        <a class="botao" href="${link}">Quero começar o Desafio 7 em 7 →</a></div>
      <div class="selos"><img src="${IMG}selo-garantia-7-dias.webp" alt="Garantia de 7 dias" width="400" height="400"><span>Compra segura · Garantia de 7 dias · Pagamento único</span></div>
      <p class="miudo">Michele Salla · CNPJ 32.983.139/0001-99</p></section>`
  }
  app.innerHTML = h
}
let trava = false // evita pular 2 telas com toque duplo
function escolhe(id, v) {
  const t = TELAS.find(x => x.id === id)
  if (trava) return
  if (t.tipo === 'varias') {
    let l = resp[id] || []
    if (v === 'nenhum') l = l.includes('nenhum') ? [] : ['nenhum']
    else { l = l.filter(x => x !== 'nenhum'); l = l.includes(v) ? l.filter(x => x !== v) : [...l, v] }
    resp[id] = l; desenha()
  } else { resp[id] = v; desenha(); trava = true; setTimeout(() => { trava = false; vai() }, 220) }
}
desenha()
</script>
</body>
</html>
